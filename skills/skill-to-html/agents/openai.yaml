interface:
  display_name: "Skill To HTML"
  short_description: "스킬을 그림 우선 인터랙티브 HTML 가이드로 변환"
  default_prompt: "Use $skill-to-html to create a 그림 우선, 인터랙티브, 애니메이션 중심 skill.html for this skill. Treat SKILL.md as the Markdown source of truth and skill.html as a visual view: read Markdown meaning, extract skill IR, map it to visual components, then render standalone HTML. Start the first viewport with an interactive visual scene, not text-heavy cards. Use Korean-first labels, short captions, SVG/CSS animation, mode switches, progressive disclosure, and evidence-linked diagrams. Keep English only for exact identifiers such as file paths, commands, product/library names, TDD, QA, API, MCP, and PRD. Optimize and verify only for PC desktop viewport; mobile/tablet layout and responsive breakpoint tuning are out of scope, but desktop click, hover, focus, and animated state changes are in scope. Keep external CDN/script/image dependencies out; use self-contained CSS/SVG/Web Animations API or short inline JavaScript, and use Framer Motion/Motion One/GSAP only when a target project bundles the dependency locally. Do not pass Markdown raw HTML, event handlers, javascript: links, external scripts, or external assets through. Keep wide scope tables and 4+ prose/contract card grids out of narrow two-column or side-panel layouts, make SVG arrows terminate at visible nodes, avoid overflow and text overlap, keep card readable width, and run the HTML validator plus PC desktop interaction checks when the layout materially changes."
