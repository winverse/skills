interface:
  display_name: "Skill To HTML"
  short_description: "스킬을 한국어 우선 정적 요약 HTML로 변환"
  default_prompt: "Use $skill-to-html to create a 짧은 정적 요약 skill.html for this skill. Treat SKILL.md as the 기준 원문 and skill.html as a human summary view. Convert Markdown through a small SkillHtmlModel before writing HTML; do not copy source paragraphs or raw Markdown structure directly into layout. Treat Markdown as 신뢰하지 않는 입력 and render only through a repo-authored 신뢰된 템플릿. 일반 설명어는 한국어로 번역하고, English is allowed only for exact identifiers such as file paths, commands, protocol names, product names, library names, and common acronyms such as TDD, QA, API, MCP, and PRD. If an English source term must remain, use 한국어(원문) only on first mention and use Korean afterward. Keep the first screen focused on the skill name, one-line purpose, use condition, and 3-5 core contracts. 인터랙티브 요소를 넣지 않는다: no buttons, no inline JavaScript, no animation, no view switching, no click-driven state, no staged reveal, and no decorative SVG. Do not pass Markdown raw HTML, event handlers, javascript: links, vbscript: links, iframe/object/embed elements, external scripts, or external assets through. Use self-contained CSS only for static layout, readable width, and overflow control. Keep wide tables and 4+ prose or contract card grids out of narrow two-column or side-panel layouts. Optimize and verify only for PC desktop viewport; mobile/tablet layout and responsive breakpoint tuning are out of scope. Run the HTML validator and check overflow, text overlap, local links, and whether the summary can be understood within 10 seconds."
