interface:
  display_name: "Skill To HTML"
  short_description: "스킬을 도표 중심 HTML 가이드로 변환"
  default_prompt: "Use $skill-to-html to create a 도표 중심 skill.html for this skill. Write visible explanations as Korean-first sentences, avoid long comma-separated English explanation terms, and keep English only for exact identifiers such as file paths, commands, product/library names, TDD, QA, API, MCP, and PRD. Optimize and verify only for PC desktop viewport; mobile/tablet layout, responsive breakpoint tuning, and touch interaction are out of scope. Keep wide scope tables out of narrow two-column layouts, make SVG arrows terminate at visible nodes, avoid overflow and text overlap, and run the HTML validator plus PC desktop viewport checks when the layout materially changes."
