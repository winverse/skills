interface:
  display_name: "Skill Update"
  short_description: "Maintain an existing shared skill end to end"
  default_prompt: "Use $skill-update to revise an existing shared skill; read docs/update-source-registry.md first as the single source registry, treat .gitmodules as the canonical source for vendored plugin/submodule path and URL candidates, verify plugin catalog and Plugin update list drift with scripts/validate-plugins.ts, verify workflow source id and usage-map drift with scripts/validate-source-registry.ts, every invocation starts with original/upstream provenance preflight, use $web-research for any found or suspected source, record adopt/adapt/reject/defer decisions, and keep SKILL.md, references, validators, skill.html, snippets, docs, and history in sync. If skill.html changes, verify wide tables, SVG arrow endpoints, overflow, and text overlap in addition to the HTML validator. Do not update plugin packages, MCP config, or submodules incidentally; when the user explicitly includes plugin updates, use the plugin update lane. When the user asks for repo-wide external dependency refresh, run a dependency update sweep across all .gitmodules vendored plugins, repo-owned plugins, docs/update-source-registry.md workflow primitive lane, and workflow upstream-dependency-map.md usage maps."
