interface:
  display_name: "Skill Plugin Test Loop"
  short_description: "스킬과 플러그인을 실제 반복으로 검증"
  default_prompt: "Use $skill-plugin-test-loop to test a skill, plugin, or plugin-bundled skill through GitHub 새 복제본 또는 격리 복사본 반복, 실제 호출 기록, cycle-NNN 산출물 폴더, 제한 실행기 증거, 실패 분류, 검증 명령, and source-fix reruns until the package behavior is proven. Use an external scratch root outside the target repo by default, such as <desktop>/skill-plugin-test-runs/<target-slug>, delete only current/ each cycle, preserve runs/ and cycles.md, and clone the remote repository into current/_github/<repo>. If the tested changes are not committed and pushed, mark the cycle as preflight or local-only and do not call it a fresh clone pass. When the target skill quality depends on external best practice, famous workflow patterns, current agent/tool behavior, security/QA guidance, or upstream docs, run $web-research as a parallel research-informed improvement lane, record official/source, community/practice, and counterexample/risk source lanes, classify findings as adopt/adapt/reject/defer, update the source skill package through $skill-update when a delta is accepted, then rerun a new cycle instead of treating research alone as proof. When web-research is skipped, still write the research ledger path with the skipped reason and defer decision."
