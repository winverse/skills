interface:
  display_name: "Project Structure"
  short_description: "Consistent app, monorepo, folder AGENTS, env, ESM TypeScript, tooling, and infra layouts"
  default_prompt: "Use $project-structure to choose a project kind, apply my default stack, and produce a consistent folder structure with DDD-lite domain-first folders, bounded context boundaries, folder-local instruction docs such as AGENTS.md or CLAUDE.md, env, GraphQL codegen, PostgreSQL/Drizzle, MongoDB Atlas, Supabase Postgres, Tauri, Pulumi/Docker/AWS infra, tests, security, and observability policies. When TypeScript is used, enforce ESM only: package.json type module, import/export syntax, ESM tsconfig settings, and no CommonJS, require, module.exports, .cjs, or .cts."
